name: Build & Release

# ───────────────────────────────────────────────
# 触发方式:
#   1) 推送 v* 标签 → 构建 + 自动创建 Release（推荐）
#      git tag v2.5.2 && git push origin v2.5.2
#   2) 手动触发 (Actions → Build & Release → Run workflow)
#      → 只构建、上传构建产物，默认不发 Release（可勾选 publish_release）
# ───────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '手动触发时是否也创建 Release'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    # windows-latest 会在 2022/2025 之间漂移，锁死 2022 保证可复现
    runs-on: windows-2022
    # OCR 版要编译 MNN（ocr-rs），单次全量构建实测可达 60-120 分钟
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup UTF-8 encoding
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::InputEncoding  = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"
          Write-Host "测试中文输出: 发票酱"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ocr-rs / MNN 需要 CMake
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Install frontend dependencies
        run: npm ci

      # 防止「tag 打的是 v2.5.2、package.json 还是 2.5.1」导致产物名错乱
      - name: Check tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag 版本: $tag / package.json 版本: $pkg"
          if ($tag -ne $pkg) {
            Write-Host "::warning::tag ($tag) 与 package.json ($pkg) 不一致，产物文件名将以 $pkg 为准"
          }

      - name: Build all (4 products)
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          npm run build:all

      - name: Verify artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 验证构建产物 ==="
          $files = @(Get-ChildItem -Path dist -File)
          if ($files.Count -ne 4) {
            Write-Host "❌ 期望 4 个产物，实际找到 $($files.Count) 个"
            $files | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          $files | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "✅ $($_.Name) ($sizeMB MB)"
          }

      # === KEY FIX =========================================================
      # File naming is owned by build-all.js (Node; on Windows it uses UTF-16,
      # independent of the console codepage). This step only VERIFIES, never renames.
      #
      # Note: the old "Normalize artifact filenames" step embedded Chinese filename
      # literals in the pwsh run: block, which got mangled by the runner codepage.
      # Here we detect Chinese via the CJK codepoint regex [\u4e00-\u9fff] with NO
      # Chinese literals. This check guards the LOCAL dist/ naming (a local build is
      # what users get when they build from source). It is NOT about Release asset
      # names — GitHub forbids non-ASCII asset names entirely, so the Release upload
      # uses separate ASCII aliases; see the "Create Release & Upload" step.
      - name: Verify artifact filenames (Chinese preserved)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -File)
          if ($files.Count -ne 4) {
            Write-Host "::error::expect 4 artifacts, got $($files.Count)"
            $files | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          foreach ($f in $files) {
            if ($f.Name -notmatch '[\u4e00-\u9fff]') {
              Write-Host "::error::artifact name missing Chinese (upstream naming lost): $($f.Name)"
              exit 1
            }
          }
          Write-Host "`n=== verified artifact filenames (all contain Chinese) ==="
          $files | ForEach-Object { Write-Host "  OK $($_.Name)" }

      - name: List final artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 最终产物列表 ==="
          Get-ChildItem -Path dist -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "  $($_.Name)  ($sizeMB MB)"
          }

      # 无论成功失败都留证据，失败时可直接下载 dist 排查
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fapiao-print-dist
          path: dist/*
          if-no-files-found: ignore
          retention-days: 7

      # 推 tag 时用 tag 名；手动触发时 github.ref_name 取到的是分支名（master），
      # 必须回落到 package.json 版本号，否则会创建名为 master 的垃圾 Release
      - name: Resolve release tag
        id: resolve_tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/*') {
            $tag = "${{ github.ref_name }}"
          } else {
            $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$v"
            Write-Host "手动触发: 由 package.json 版本 $v 推导 tag = $tag"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Host "::error::解析出的 tag 非法: $tag（应为 vX.Y.Z 格式）"
            exit 1
          }
          Write-Host "release tag = $tag"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n")

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve_tag.outputs.tag }}"
          Write-Host "Extracting release notes for tag: $tag"

          $lines  = Get-Content CHANGELOG.md -Encoding UTF8
          $prefix = "^## " + [Regex]::Escape($tag) + "(\s|$|-|—|:)"
          $capturing = $false
          $bodyLines = @()

          foreach ($line in $lines) {
            if (-not $capturing -and $line -match $prefix) {
              $capturing = $true
              continue          # 跳过标题行本身，body 从内容开始
            }
            if ($capturing) {
              if ($line -match "^---\s*$") { break }   # 分隔线 = 本段结束
              if ($line -match "^## ")      { break }  # 下一个版本标题
              $bodyLines += $line
            }
          }

          $body = ($bodyLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) { $body = "发布 $tag" }

          # 「中文说明 ↔ 实际文件名」对照表：Release 资产名只能用 ASCII（平台限制，见下），
          # 这里把 dist/ 的中文名与上传用的 ASCII 别名一一列出，方便用户选对文件。
          # 清单由 build-all.js 同源生成（唯一来源），本步只读取渲染，不猜命名规则。
          if (Test-Path release-assets.json) {
            $manifest = Get-Content release-assets.json -Raw -Encoding UTF8 | ConvertFrom-Json
            $rows = @()
            $rows += ''
            $rows += '### 📦 下载文件'
            $rows += ''
            $rows += '| 说明 | 实际文件名 |'
            $rows += '| --- | --- |'
            foreach ($a in $manifest.assets) {
              $rows += '| ' + $a.label + ' | `' + $a.ascii + '` |'
            }
            $rows += ''
            $rows += '> GitHub Release 的资产名不支持非 ASCII 字符（平台限制，gh CLI #8580），'
            $rows += '> 中文名会被服务端替换成 `.`，故 Release 上一律使用上表的 ASCII 别名。'
            $rows += '> 本地源码构建（`npm run build:all`）得到的仍是中文文件名，例如 `' + $manifest.assets[0].file + '`。'
            $body += "`n" + ($rows -join "`n")
          } else {
            Write-Host "::warning::未找到 release-assets.json，Release 说明将不含「中文说明 ↔ 文件名」对照表"
          }

          $body += "`n`n---`n详见 [CHANGELOG](https://github.com/chenghaitao/fapiao-print/blob/master/CHANGELOG.md)"

          $body | Out-File -FilePath release_body.txt -Encoding UTF8 -NoNewline
          Write-Host "`n=== Release Body Preview ==="
          Write-Host $body

      # Release 资产名不支持非 ASCII —— 这是 GitHub 平台限制（服务端把中文替换成「.」，
      # gh CLI issue #8580 已确认 webui 同样如此），不是编码问题，改 PowerShell/gh 参数无用。
      # 做法：上传前把 dist/ 的 4 个中文产物复制成 ASCII 别名（别名由 build-all.js 与中文名
      # 同源生成，清单落在 release-assets.json），dist/ 保留中文名供本地分发；
      # 「中文说明 ↔ 实际文件名」对照表已写进 Release 说明（见上一步）。
      - name: Create Release & Upload (gh CLI)
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 确保 PowerShell 以 UTF-8 与外部进程(gh)交换含中文的参数
          $OutputEncoding         = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001 | Out-Null

          $tag  = "${{ steps.resolve_tag.outputs.tag }}"
          $repo = "chenghaitao/fapiao-print"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          # 读取 build-all.js 生成的清单（中文说明 / 中文名 / ASCII 别名 的唯一来源）
          if (-not (Test-Path release-assets.json)) {
            Write-Host "::error::未找到 release-assets.json（应由 build-all.js 生成，检查 Build all 步骤）"
            exit 1
          }
          $manifest = Get-Content release-assets.json -Raw -Encoding UTF8 | ConvertFrom-Json

          # 准备上传目录：把 dist/ 的中文产物复制成 ASCII 别名。
          # GitHub 的 Release 资产名不支持非 ASCII（平台限制，gh CLI #8580），
          # 直接用中文名上传只会得到 `_2.6.x_x64-.exe` 这类残缺名；dist/ 保留中文供本地分发。
          $uploadDir = "dist-upload"
          if (Test-Path $uploadDir) { Remove-Item $uploadDir -Recurse -Force }
          New-Item -ItemType Directory -Path $uploadDir | Out-Null

          $expected = @()
          foreach ($a in $manifest.assets) {
            $src = Join-Path "dist" $a.file
            if (-not (Test-Path $src)) {
              Write-Host "::error::产物缺失: $($a.file)"
              exit 1
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $uploadDir $a.ascii) -Force
            $expected += $a.ascii
            Write-Host "别名: $($a.file)  ->  $($a.ascii)"
            if ($a.file -notmatch '[\u4e00-\u9fff]') {
              Write-Host "::warning::dist 产物名缺少中文（仅影响本地分发命名）: $($a.file)"
            }
          }
          if ($expected.Count -ne 4) {
            Write-Host "::error::期望 4 个上传产物，实际 $($expected.Count)"
            exit 1
          }

          # 带「-」的 tag（如 v2.6.12-beta.1）发布为预发布：GitHub 的 /releases/latest
          # 不含预发布，因此不会被应用内更新检查推送给所有用户（供指定用户试用验证）
          $isPre = $tag.Contains('-')

          gh release view "$tag" --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "创建 Release $tag (prerelease=$isPre)"
            if ($isPre) {
              gh release create "$tag" --repo $repo --title "$tag" --notes-file release_body.txt --prerelease
            } else {
              gh release create "$tag" --repo $repo --title "$tag" --notes-file release_body.txt
            }
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::创建 Release 失败"; exit 1 }
          } else {
            Write-Host "Release $tag 已存在，覆盖更新说明与资产"
            # 重跑（补发资产 / 修 CI 后重发）时说明也要跟着刷新，
            # 否则新增的「中文说明 ↔ 文件名」对照表不会出现在已有 Release 上
            gh release edit "$tag" --repo $repo --notes-file release_body.txt
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::更新 Release 说明失败"; exit 1 }
            if ($isPre) {
              gh release edit "$tag" --repo $repo --prerelease
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::设置预发布标记失败"; exit 1 }
            }
          }

          # 清理同版本历史上传的旧资产：含更早上传时被服务端吞掉中文的 _2.6.x_x64-.exe
          # 以及旧别名，避免新旧文件同时显示在 Release 页面上。
          $versionPattern = "_" + [Regex]::Escape($version) + "_"
          $oldAssets = @(gh release view "$tag" --repo $repo --json assets --jq '.assets[].name')
          foreach ($asset in $oldAssets) {
            if ($asset -match $versionPattern -and $asset -notin $expected) {
              Write-Host "删除旧资产: $asset"
              gh release delete-asset "$tag" $asset --repo $repo --yes
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::删除旧资产失败: $asset"; exit 1 }
            }
          }

          Get-ChildItem -Path $uploadDir -File | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 1)
            Write-Host "上传: $($_.Name)  ($mb MB)"
            # 上传的就是 ASCII 别名文件，gh 取 basename 作为资产名 → 结果确定且干净
            gh release upload "$tag" "$($_.FullName)" --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::上传失败: $($_.Name)"; exit 1 }
          }

          Write-Host "`n=== Release 最终资产 ==="
          $assetNames = @(gh release view "$tag" --repo $repo --json assets --jq '.assets[].name')
          $assetNames | ForEach-Object { Write-Host "  $_" }

          # 断言（可满足）：资产名必须与清单里的 ASCII 别名逐一吻合。
          # 注意：不要断言「资产名含中文」—— GitHub 服务端不支持非 ASCII 资产名
          # （平台限制，gh CLI #8580 已 blocked），那条断言永远不可能通过。
          if ($assetNames.Count -ne $expected.Count) {
            Write-Host "::error::Release 资产数不符: 期望 $($expected.Count)，实际 $($assetNames.Count)"
            exit 1
          }
          foreach ($an in $assetNames) {
            if ($an -notin $expected) {
              Write-Host "::error::出现非预期资产名: $an"
              exit 1
            }
            if ($an -match '[^\x20-\x7e]') {
              Write-Host "::error::资产名含非 ASCII 字符: $an"
              exit 1
            }
          }
          Write-Host "OK 4 个资产名均为 ASCII 别名，与 release-assets.json 一致"
