name: Build & Release

# ───────────────────────────────────────────────
# 触发方式:
#   1) 推送 v* 标签 → 构建 + 自动创建 Release（推荐）
#      git tag v2.5.2 && git push origin v2.5.2
#   2) 手动触发 (Actions → Build & Release → Run workflow)
#      → 只构建、上传构建产物，默认不发 Release（可勾选 publish_release）
# ───────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '手动触发时是否也创建 Release'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    # windows-latest 会在 2022/2025 之间漂移，锁死 2022 保证可复现
    runs-on: windows-2022
    # OCR 版要编译 MNN（ocr-rs），单次全量构建实测可达 60-120 分钟
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UTF-8 encoding
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::InputEncoding  = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"
          Write-Host "测试中文输出: 发票酱"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ocr-rs / MNN 需要 CMake
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Install frontend dependencies
        run: npm ci

      # 防止「tag 打的是 v2.5.2、package.json 还是 2.5.1」导致产物名错乱
      - name: Check tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag 版本: $tag / package.json 版本: $pkg"
          if ($tag -ne $pkg) {
            Write-Host "::warning::tag ($tag) 与 package.json ($pkg) 不一致，产物文件名将以 $pkg 为准"
          }

      - name: Build all (4 products)
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          npm run build:all

      - name: Verify artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 验证构建产物 ==="
          $files = @(Get-ChildItem -Path dist -File)
          if ($files.Count -ne 4) {
            Write-Host "❌ 期望 4 个产物，实际找到 $($files.Count) 个"
            $files | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          $files | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "✅ $($_.Name) ($sizeMB MB)"
          }

      # 兜底：NSIS 在 CI 上偶尔丢失中文文件名，强制改名
      - name: Rename if Chinese lost (fallback)
        shell: pwsh
        run: |
          $dist = "dist"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          $renameMap = @{
            "_${version}_x64-setup.exe"      = "发票酱_${version}_x64-setup.exe"
            "_${version}_x64_OCR.-setup.exe" = "发票酱_${version}_x64_OCR版-setup.exe"
            "_${version}_x64_OCR-setup.exe"  = "发票酱_${version}_x64_OCR版-setup.exe"
            "_${version}_x64_.exe"           = "发票酱_${version}_x64_绿色版.exe"
            "_${version}_x64_OCR.zip"        = "发票酱_${version}_x64_OCR绿色版.zip"
          }

          foreach ($entry in $renameMap.GetEnumerator()) {
            $oldPath = Join-Path $dist $entry.Key
            $newPath = Join-Path $dist $entry.Value
            if (Test-Path $oldPath) {
              Move-Item -Force $oldPath $newPath
              Write-Host "🔄 重命名: $($entry.Key) → $($entry.Value)"
            }
          }

      - name: List final artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== 最终产物列表 ==="
          Get-ChildItem -Path dist -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "  $($_.Name)  ($sizeMB MB)"
          }

      # 无论成功失败都留证据，失败时可直接下载 dist 排查
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 发票酱-dist
          path: dist/*
          if-no-files-found: ignore
          retention-days: 7

      # 推 tag 时用 tag 名；手动触发时 github.ref_name 取到的是分支名（master），
      # 必须回落到 package.json 版本号，否则会创建名为 master 的垃圾 Release
      - name: Resolve release tag
        id: resolve_tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/*') {
            $tag = "${{ github.ref_name }}"
          } else {
            $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$v"
            Write-Host "手动触发: 由 package.json 版本 $v 推导 tag = $tag"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Host "::error::解析出的 tag 非法: $tag（应为 vX.Y.Z 格式）"
            exit 1
          }
          Write-Host "release tag = $tag"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n")

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve_tag.outputs.tag }}"
          Write-Host "Extracting release notes for tag: $tag"

          $lines  = Get-Content CHANGELOG.md -Encoding UTF8
          $prefix = "^## " + [Regex]::Escape($tag) + "(\s|$|-|—|:)"
          $capturing = $false
          $bodyLines = @()

          foreach ($line in $lines) {
            if (-not $capturing -and $line -match $prefix) {
              $capturing = $true
              continue          # 跳过标题行本身，body 从内容开始
            }
            if ($capturing) {
              if ($line -match "^---\s*$") { break }   # 分隔线 = 本段结束
              if ($line -match "^## ")      { break }  # 下一个版本标题
              $bodyLines += $line
            }
          }

          $body = ($bodyLines -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "发布 $tag`n`n详见 [CHANGELOG](https://github.com/chenghaitao/fapiao-print/blob/master/CHANGELOG.md)"
          } else {
            $body += "`n`n---`n详见 [CHANGELOG](https://github.com/chenghaitao/fapiao-print/blob/master/CHANGELOG.md)"
          }

          $body | Out-File -FilePath release_body.txt -Encoding UTF8 -NoNewline
          Write-Host "`n=== Release Body Preview ==="
          Write-Host $body

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body_path: release_body.txt
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
